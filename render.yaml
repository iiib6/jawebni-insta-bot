services:
  - type: web
    name: jawebni-insta-bot
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_TYPE
        value: "sqlite"
      - key: DB_SQLITE_DATABASE
        value: "/home/node/.n8n/database.sqlite"
      - key: N8N_USER_FOLDER
        value: "/home/node"
      - key: N8N_PORT
        value: "10000"
      - key: PORT
        value: "10000"
      - key: N8N_HOST
        value: "0.0.0.0"
      - key: N8N_PROTOCOL
        value: "https"
      - key: N8N_EDITOR_BASE_URL
        value: "https://jawebni-insta-bot.onrender.com"
      - key: N8N_WEBHOOK_URL
        value: "https://jawebni-insta-bot.onrender.com/"
      - key: N8N_SECURE_COOKIE
        value: "false"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "false"
