services:
  - type: web
    name: jawebni-insta-bot
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_TYPE
        value: "postgresdb"
      - key: DB_POSTGRESDB_HOST
        value: "dpg-d9qf2ff10e5c739hrpl0-a"
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_DATABASE
        value: "jawebni_db"
      - key: DB_POSTGRESDB_USER
        value: "jawebni_db_user"
      - key: DB_POSTGRESDB_PASSWORD
        value: "ywiN9d37JcCLFpvHQNDQU7ACTrHZRHKL"
      - key: N8N_USER_FOLDER
        value: "/home/node"
      - key: N8N_PORT
        value: "10000"
      - key: PORT
        value: "10000"
      - key: N8N_HOST
        value: "0.0.0.0"
      - key: N8N_PROTOCOL
        value: "https"
      - key: N8N_EDITOR_BASE_URL
        value: "https://jawebni-insta-bot.onrender.com"
      - key: N8N_WEBHOOK_URL
        value: "https://jawebni-insta-bot.onrender.com/"
      - key: N8N_SECURE_COOKIE
        value: "false"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "false"
